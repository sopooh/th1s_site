<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg:#FAFAF7;
  --ink:#111110;
  --muted:#8C8C86;
  --line:#E2E1DB;--thumb:#EFEEE9;
  --sans:'Archivo',-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;padding:24px 32px 32px;min-height:100vh;
  display:flex;flex-direction:column;
}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
nav{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:16px}
.wordmark{font-size:15px;letter-spacing:-.02em;font-weight:700;color:var(--ink);text-decoration:none}
.nav-links{display:flex;gap:24px}
.nav-links a{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s}
.nav-links a:hover,.nav-links a:focus-visible,.nav-links a[aria-current]{color:var(--ink)}

.rule{border-top:1px solid var(--line)}
.labels{display:grid;grid-template-columns:1fr 1fr;padding:12px 0 48px}
.labels .right{display:grid;grid-template-columns:56px 110px 1fr 64px;gap:12px}

.body-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;flex:1}

.stage{position:relative;position:sticky;top:24px;min-height:520px;align-self:start}
.statement{
  font-size:44px;line-height:1.15;letter-spacing:-.01em;font-weight:400;
  transition:opacity .3s;
}
.statement .dim{color:var(--muted)}
.stage.active .statement{opacity:0}

.now{position:absolute;top:0;left:0;opacity:0;visibility:hidden;transition:opacity .3s}
.stage.active .now{opacity:1;visibility:visible}
.now .thumb{position:relative;width:220px;aspect-ratio:9/16;background:var(--thumb);display:flex;align-items:center;justify-content:center;margin-bottom:12px;overflow:hidden;transition:width .3s,aspect-ratio .3s}
.now .thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.now .thumb.playing video{opacity:1}
.now .thumb span{font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--muted)}
.reel{width:220px;display:flex;align-items:center;gap:12px;margin-bottom:20px;opacity:0;transition:opacity .2s;pointer-events:none}
.reel.on{opacity:1;pointer-events:auto}
.reel .count{font-family:var(--mono);font-size:12px;color:var(--muted)}
.reel button{border:0;background:none;padding:0;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;font-family:var(--sans);transition:color .2s}
.reel button:hover{color:var(--ink)}
.now .pid{font-family:var(--mono);font-size:12px;color:var(--muted)}
.now .pbrand{font-size:15px;letter-spacing:.02em;color:var(--muted);margin-top:8px}
.now .ptitle{font-size:40px;line-height:1.1;letter-spacing:-.01em;margin-top:4px}

.list{display:flex;flex-direction:column}
.row{
  display:grid;grid-template-columns:56px 110px 1fr 64px;align-items:baseline;gap:12px;
  padding:7px 0;background:none;border:0;width:100%;text-align:left;font:inherit;
  color:var(--muted);cursor:pointer;transition:color .2s;
}
.row .code{font-family:var(--mono);font-size:12px}
.row .bname{font-size:16px;letter-spacing:.01em;color:var(--ink);opacity:.55;transition:opacity .2s}
.row .name{font-size:16px;letter-spacing:.01em}

.row .yr{font-family:var(--mono);font-size:12px;text-align:right}
.row:hover,.row:focus-visible{color:var(--ink);outline:none}
.row:hover .bname,.row:focus-visible .bname{opacity:1}
.row.is-active{color:var(--ink)}
.row.is-active .bname{opacity:1}
.row:focus-visible .code{text-decoration:underline}
a.row{text-decoration:none}
a.row:hover .name,a.row:focus-visible .name{text-decoration:underline;text-underline-offset:3px}

.bio{max-width:420px;margin-top:48px}
.bio p{font-size:12px;line-height:1.5;color:var(--muted);margin-top:12px}
footer{display:flex;justify-content:space-between;padding-top:12px;margin-top:48px}

@media (max-width:820px){
  body{padding:20px}
  .body-grid{grid-template-columns:1fr;gap:32px}
  .labels{grid-template-columns:1fr;padding-bottom:24px}
  .labels .left{display:none}
  .stage{display:none}
  .now .ptitle{font-size:26px}
  .statement{font-size:30px}
  .row .name,.row .bname{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

];

const list = document.getElementById("list");
const stage = document.getElementById("stage");
const pId = document.getElementById("p-id");
const pBrand = document.getElementById("p-brand");
const pTitle = document.getElementById("p-title");
const thumb = document.getElementById("thumb");
const pv = document.getElementById("pv");
const reel = document.getElementById("reel");
const rcount = document.getElementById("rcount");
let shot = 0;

pv.addEventListener("error", () => thumb.classList.remove("playing"));

pv.addEventListener("loadedmetadata", () => {
  if (!pv.videoWidth || !pv.videoHeight) return;
  const r = pv.videoWidth / pv.videoHeight;
  thumb.style.aspectRatio = pv.videoWidth + " / " + pv.videoHeight;
  thumb.style.width = r > 1.2 ? "340px" : (r > 0.85 ? "280px" : "220px");
});

function showShot(){
  const files = current < 0 ? [] : data[current][5];
  thumb.classList.remove("playing");
  reel.classList.toggle("on", files.length > 1);
  if (files.length > 1) {
    rcount.textContent = String(shot + 1).padStart(2, "0") + " / " + String(files.length).padStart(2, "0");
  }
  thumb.style.aspectRatio = "";
  thumb.style.width = "";
  if (!files.length) { pv.removeAttribute("src"); return; }
  pv.src = "video/" + files[shot];
  pv.play().then(() => thumb.classList.add("playing")).catch(() => {});
}

function step(n){
  const files = current < 0 ? [] : data[current][5];
  if (files.length < 2) return;
  shot = (shot + n + files.length) % files.length;
  showShot();
}
document.getElementById("rprev").addEventListener("click", () => step(-1));
document.getElementById("rnext").addEventListener("click", () => step(1));
const els = [];

data.forEach(([code,brand,title,id,year,files,page], i) => {
  const b = document.createElement(page ? "a" : "button");
  if (page) b.href = page;
  b.className = "row";
  b.innerHTML = '<span class="code"></span><span class="bname"></span><span class="name"></span><span class="yr"></span>';
  b.querySelector(".code").textContent = code;
  b.querySelector(".bname").textContent = brand;
  b.querySelector(".name").textContent = title;
  b.querySelector(".yr").textContent = year;
  b.addEventListener("mouseenter", () => setActive(i));
  b.addEventListener("focus", () => setActive(i));
  list.appendChild(b);
  els.push(b);
});

let current = -1;
function setActive(i){
  if (i === current) return;
  if (els[current]) els[current].classList.remove("is-active");
  current = i;
  if (i < 0){ stage.classList.remove("active"); return; }
  const [,brand,title,id] = data[i];
  pId.textContent = id;
  pBrand.textContent = brand;
  pTitle.textContent = title;
  els[i].classList.add("is-active");
  stage.classList.add("active");

  shot = 0;
  showShot();
}

const visible = new Set();
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    const i = els.indexOf(e.target);
    if (e.isIntersecting) visible.add(i); else visible.delete(i);
  });
  if (visible.size) setActive(Math.min(...visible));
  else if (window.scrollY < 40) setActive(-1);
}, { rootMargin: "-45% 0px -45% 0px", threshold: 0 });

els.forEach(el => io.observe(el));

</script>
