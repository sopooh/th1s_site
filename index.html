<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>th1s.prd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF7;--ink:#111110;--muted:#8C8C86;--line:#E2E1DB;--thumb:#EFEEE9;
  --sans:'Archivo',-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:0 32px 32px}
a{color:inherit;text-decoration:none}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rule{border-top:1px solid var(--line)}

/* ---------- hero: progetto in evidenza, a filo dei bordi ---------- */
.hero{position:relative;display:block;margin:0 -32px;height:44vh;min-height:300px;background:#161615;overflow:hidden;color:#fff}
.hero video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.hero video.ready{opacity:1}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(to top,rgba(0,0,0,.35),rgba(0,0,0,0));pointer-events:none}
.hero .top{position:absolute;left:32px;right:32px;top:24px;display:flex;justify-content:space-between;z-index:1}
.hero .top span{font-family:var(--mono);font-size:12px;color:#fff;opacity:.9}
.hero .cap{position:absolute;left:32px;right:32px;bottom:24px;z-index:1;transition:opacity .3s}
.hero .pid{font-family:var(--mono);font-size:12px}
.hero .pbrand{font-size:15px;letter-spacing:.02em;margin-top:8px}
.hero .ptitle{font-size:40px;line-height:1.1;letter-spacing:-.01em;font-weight:400;margin-top:4px}
.hero .go{display:inline-block;margin-top:16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.6);padding-bottom:2px}
.hero:hover .go{border-color:#fff}

/* ---------- nav ---------- */
nav{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0}
.wordmark{font-size:15px;letter-spacing:-.02em;font-weight:700}
.nav-links{display:flex;gap:24px}
.nav-links a{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);transition:color .2s}
.nav-links a:hover,.nav-links a:focus-visible,.nav-links a[aria-current]{color:var(--ink)}
.labels{display:flex;justify-content:space-between;padding:12px 0 24px}

/* ---------- showcase: griglia di miniature ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:48px 16px}
.card{display:block}
.card .m{position:relative;aspect-ratio:4/5;background:var(--thumb) center/cover no-repeat;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card .m .ph{font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--muted)}
.card video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.card video.ready{opacity:1}
.card .n{position:absolute;right:8px;bottom:8px;font-family:var(--mono);font-size:11px;color:#fff;opacity:0;transition:opacity .2s}
.card:hover .n,.card.on .n{opacity:.9}
.card .t{display:block;margin-top:8px;font-size:14px;font-weight:500;line-height:1.25}
.card .b{display:block;font-size:14px;line-height:1.25;color:var(--muted)}
.card .y{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
.card:hover .t,.card:focus-visible .t{text-decoration:underline;text-underline-offset:3px}

footer{display:flex;justify-content:space-between;margin-top:96px;padding-top:12px}

@media (max-width:820px){
  body{padding:0 20px 20px}
  .hero{margin:0 -20px;height:36vh;min-height:240px}
  .hero .top,.hero .cap{left:20px;right:20px}
  .hero .ptitle{font-size:28px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 10px}
  .card .t,.card .b{font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<a class="hero" id="hero" href="#">
  <video id="hv" muted loop playsinline autoplay preload="auto"></video>
  <div class="top"><span>FEATURED</span><span id="h-meta"></span></div>
  <div class="cap">
    <div class="pid" id="h-id"></div>
    <div class="pbrand" id="h-brand"></div>
    <div class="ptitle" id="h-title"></div>
    <span class="go">View project</span>
  </div>
</a>

<nav>
  <a class="wordmark" href="index.html">th1s.prd</a>
  <div class="nav-links">
    <a href="index.html" aria-current="page">Work</a>
    <a href="archive.html">Index</a>
    <a href="studio.html">Studio</a>
    <a href="studio.html#contact">Contact</a>
  </div>
</nav>
<div class="rule"></div>
<div class="labels">
  <span class="eyebrow">Selected work</span>
  <span class="eyebrow" id="count"></span>
</div>

<main class="grid" id="grid"></main>

<div class="rule" style="margin-top:96px"></div>
<footer>
  <span class="eyebrow">th1s.prd (24/26)</span>
  <span class="eyebrow" style="text-align:right">All rights reserved<br>[00]</span>
</footer>

<script src="data.js"></script>
<script src="vimeo_extra.js" onerror="window.vimeoExtra={}"></script>
<script>
// ---------------- da modificare a mano ----------------
// Progetti tra cui pescare quello in evidenza, a caso.
const FEATURED = [];          // es. ["THIS26-024", "THIS25-007"]; vuoto = tutti
// Ogni quanti secondi cambia il progetto in evidenza (0 = solo a ogni visita).
const ROTATE = 8;
// Progetti nella griglia, nell'ordine voluto. Vuoto = tutti, dal piu recente.
const SHOWCASE = [];
// ------------------------------------------------------

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const vx = (typeof vimeoExtra !== "undefined" && vimeoExtra) || {};
const byId = Object.fromEntries(data.map(r => [r[3], r]));
const pageOf = r => r[6] || "progetto.html?id=" + r[3];
const thumbOf = f => f && f.startsWith("vimeo:") && vx[f] ? vx[f].thumb : "";

// ---------- hero: un progetto a caso, cambia da solo ----------
// Pesca tra FEATURED (se vuoto: tra tutti i progetti con un loop), una variante a caso,
// e passa al successivo ogni ROTATE secondi. Se un file manca, salta al prossimo.
const pool = (FEATURED.length ? FEATURED.map(id => byId[id]) : data)
  .filter(r => r && r[5].some(f => !f.startsWith("vimeo:")));
const hv = $("hv");
let lastId = null, rotT = 0, fails = 0;
hv.addEventListener("playing", () => { hv.classList.add("ready"); fails = 0; });
hv.addEventListener("error", () => { if (++fails < 5) nextHero(); });

function nextHero(){
  if (!pool.length) return;
  let r, guard = 0;
  do { r = pool[Math.floor(Math.random() * pool.length)]; } while (pool.length > 1 && r[3] === lastId && ++guard < 10);
  lastId = r[3];
  const [market, brand, title, id, year, files] = r;
  const local = files.filter(f => !f.startsWith("vimeo:"));
  const f = local[Math.floor(Math.random() * local.length)];
  hv.classList.remove("ready");
  setTimeout(() => {                                   // dissolvenza: prima sparisce, poi cambia
    $("hero").href = pageOf(r);
    $("h-id").textContent = id;
    $("h-brand").textContent = brand;
    $("h-title").textContent = title;
    $("h-meta").textContent = [brand, year, files.length > 1 ? pad(files.length) + " films" : ""].filter(Boolean).join(" \u00b7 ").toUpperCase();
    hv.src = "video/" + f;                             // loop HD: la hero e grande
    hv.play().catch(() => {});
  }, hv.src ? 300 : 0);
  clearTimeout(rotT);
  if (ROTATE > 0 && !matchMedia("(prefers-reduced-motion: reduce)").matches) rotT = setTimeout(nextHero, ROTATE * 1000);
}
nextHero();

// ---------- griglia ----------
const rows = (SHOWCASE.length ? SHOWCASE.map(id => byId[id]) : data).filter(r => r && r[5].length);
$("count").textContent = pad(rows.length) + " projects";
const grid = $("grid");
const cards = [];

rows.forEach(r => {
  const [market, brand, title, id, year, files] = r;
  const a = el("a", "card"); a.href = pageOf(r);
  const m = el("span", "m");
  const t = thumbOf(files[0]);
  if (t) m.style.backgroundImage = "url(" + t + ")"; else m.append(el("span", "ph", "th1s.prd"));
  if (!files[0].startsWith("vimeo:")) {
    const v = document.createElement("video");
    v.muted = true; v.loop = true; v.playsInline = true; v.preload = "none";
    v.dataset.src = "video_sm/" + files[0];          // loop leggeri; se mancano, quelli HD
    v.addEventListener("error", () => {
      if (v.dataset.src.startsWith("video_sm/")) { v.dataset.src = "video/" + files[0]; v.src = v.dataset.src + "#t=0.1"; }
      else v.remove();
    });
    v.addEventListener("loadeddata", () => v.classList.add("ready"));
    m.append(v);
  }
  if (files.length > 1) m.append(el("span", "n", pad(files.length)));
  a.append(m, el("span", "t", title), el("span", "b", brand + " · " + market), el("span", "y", id + " · " + year));
  grid.append(a);
  cards.push(a);
});

// carica il primo fotogramma solo quando la card si avvicina allo schermo
const near = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  const v = e.target.querySelector("video");
  if (v && !v.src) { v.preload = "auto"; v.src = v.dataset.src + "#t=0.1"; }   // loop piccoli (~200 KB): si scaricano solo vicino allo schermo
  near.unobserve(e.target);
}), { rootMargin: "400px 0px" });
cards.forEach(c => near.observe(c));

// movimento: con il mouse parte la card sotto il puntatore;
// su telefono parte la card che attraversa il centro dello schermo, una alla volta
const play = c => { const v = c.querySelector("video"); if (v && v.src) { v.play().catch(() => {}); c.classList.add("on"); } };
const stop = c => { const v = c.querySelector("video"); if (v) v.pause(); c.classList.remove("on"); };
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

if (matchMedia("(hover: hover)").matches) {
  cards.forEach(c => { c.addEventListener("mouseenter", () => play(c)); c.addEventListener("mouseleave", () => stop(c)); });
} else if (!reduce) {
  let current = null;
  const mid = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { if (current && current !== e.target) stop(current); current = e.target; play(current); }
    else if (e.target === current) { stop(current); current = null; }
  }), { rootMargin: "-45% 0px -45% 0px" });
  cards.forEach(c => mid.observe(c));
}
</script>
</body>
</html>
