<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF7;
  --ink:#111110;
  --muted:#8C8C86;
  --line:#E2E1DB;--thumb:#EFEEE9;
  --sans:'Archivo',-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;padding:24px 32px 32px;min-height:100vh;
  display:flex;flex-direction:column;
}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
nav{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:16px}
.wordmark{font-size:15px;letter-spacing:-.02em;font-weight:700;color:var(--ink);text-decoration:none}
.nav-links{display:flex;gap:24px}
.nav-links a{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s}
.nav-links a:hover,.nav-links a:focus-visible,.nav-links a[aria-current]{color:var(--ink)}

.rule{border-top:1px solid var(--line)}
.labels{display:grid;grid-template-columns:1fr 1fr;padding:12px 0 48px}
.labels .right{display:grid;grid-template-columns:56px 110px 1fr 64px;gap:12px}

.body-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;flex:1}

/* Colonna sinistra: video a tutta altezza, a filo del bordo sinistro */
.stage{
  position:sticky;top:0;align-self:start;
  height:100vh;margin-left:-32px;
  background:var(--thumb);overflow:hidden;
}
.statement{
  position:absolute;left:32px;bottom:48px;
  font-size:44px;line-height:1.15;letter-spacing:-.01em;font-weight:400;
  transition:opacity .3s;
}
.statement .dim{color:var(--muted)}
.stage.active .statement{opacity:0}

.now{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .3s;color:var(--ink)}
.stage.active .now{opacity:1;visibility:visible}
.now .thumb{position:absolute;inset:0;background:var(--thumb) center/cover no-repeat;display:flex;align-items:center;justify-content:center;overflow:hidden}
/* lavori solo su Vimeo: al posto del loop c'è la miniatura */
.now .thumb.still span{opacity:0}
.now .thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.now .thumb.playing video{opacity:1}
.now .thumb span{font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--muted)}
/* velatura minima in basso, solo per leggere il testo bianco */
.now .thumb::after{content:"";position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(to top,rgba(0,0,0,.35),rgba(0,0,0,0));opacity:0;transition:opacity .3s}
.now .thumb.playing::after{opacity:1}

.reel{position:absolute;top:24px;left:32px;display:flex;align-items:center;gap:12px;opacity:0;transition:opacity .2s;pointer-events:none}
.reel.on{opacity:1;pointer-events:auto}
.reel .count{font-family:var(--mono);font-size:12px;color:inherit}
.reel button{border:0;background:none;padding:4px;cursor:pointer;color:inherit;font-size:18px;line-height:1;font-family:var(--sans);opacity:.75;transition:opacity .2s}
.reel button:hover{opacity:1}

.caption{position:absolute;left:32px;right:32px;bottom:48px}
.now .pid{font-family:var(--mono);font-size:12px}
.now .pbrand{font-size:15px;letter-spacing:.02em;margin-top:8px}
.now .ptitle{font-size:40px;line-height:1.1;letter-spacing:-.01em;margin-top:4px}

/* con il video in riproduzione tutto il testo va in bianco */
.now:has(.thumb.playing){color:#FFFFFF}

.list{display:flex;flex-direction:column}
.row{
  display:grid;grid-template-columns:56px 110px 1fr 64px;align-items:baseline;gap:12px;
  padding:7px 0;background:none;border:0;width:100%;text-align:left;font:inherit;
  color:var(--muted);cursor:pointer;transition:color .2s;
}
.row .code{font-family:var(--mono);font-size:12px}
.row .bname{font-size:16px;letter-spacing:.01em;color:var(--ink);opacity:.55;transition:opacity .2s}
.row .name{font-size:16px;letter-spacing:.01em}

.row .yr{font-family:var(--mono);font-size:12px;text-align:right}
.row:hover,.row:focus-visible{color:var(--ink);outline:none}
.row:hover .bname,.row:focus-visible .bname{opacity:1}
.row.is-active{color:var(--ink)}
.row.is-active .bname{opacity:1}
.row:focus-visible .code{text-decoration:underline}
a.row{text-decoration:none}
a.row:hover .name,a.row:focus-visible .name{text-decoration:underline;text-underline-offset:3px}

.bio{max-width:420px;margin-top:48px}
.bio p{font-size:12px;line-height:1.5;color:var(--muted);margin-top:12px}
footer{display:flex;justify-content:space-between;padding-top:12px;margin-top:48px}

@media (max-width:820px){
  body{padding:20px}
  .stage{margin-left:0}
  .body-grid{grid-template-columns:1fr;gap:32px}
  .labels{grid-template-columns:1fr;padding-bottom:24px}
  .labels .left{display:none}
  .stage{display:none}
  .now .ptitle{font-size:26px}
  .statement{font-size:30px}
  .row .name,.row .bname{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<nav>
  <span class="wordmark">th1s.prd</span>
  <div class="nav-links">
    <a href="#" aria-current="page">Work</a>
    <a href="#">Studio</a>
    <a href="#">Contact</a>
  </div>
</nav>

<div class="rule"></div>
<div class="labels">
  <span class="eyebrow left">Archive 2026 / 2024</span>
  <span class="right">
    <span class="eyebrow">Market</span>
    <span class="eyebrow">Brand</span>
    <span class="eyebrow">Project</span>
    <span class="eyebrow" style="text-align:right">Year</span>
  </span>
</div>

<div class="body-grid">
  <div class="stage" id="stage">
    <div class="statement">Selected work</div>
    <div class="now">
      <div class="thumb" id="thumb"><video id="pv" muted loop playsinline preload="none"></video><span>th1s.prd</span></div>
      <div class="reel" id="reel">
        <button id="rprev" aria-label="Video precedente">&lsaquo;</button>
        <span class="count" id="rcount"></span>
        <button id="rnext" aria-label="Video successivo">&rsaquo;</button>
      </div>
      <div class="caption">
        <div class="pid" id="p-id"></div>
        <div class="pbrand" id="p-brand"></div>
        <div class="ptitle" id="p-title"></div>
      </div>
    </div>
  </div>

  <div class="list" id="list"></div>
</div>

<div class="bio">
  <div class="rule"></div>
  <span class="eyebrow" style="display:block;padding-top:12px">Biography</span>
  <p>Direction, editing and social content for fashion and luxury. Based in Milan, working across Europe, the United States and Asia.</p>
</div>

<div class="rule" style="margin-top:24px"></div>
<footer>
  <span class="eyebrow">th1s.prd (24/26)</span>
  <span class="eyebrow" style="text-align:right">All rights reserved<br>[01]</span>
</footer>

<script src="data.js"></script>
<script src="vimeo_extra.js" onerror="window.vimeoExtra={}"></script>
<script>

const list = document.getElementById("list");
const stage = document.getElementById("stage");
const pId = document.getElementById("p-id");
const pBrand = document.getElementById("p-brand");
const pTitle = document.getElementById("p-title");
const thumb = document.getElementById("thumb");
const pv = document.getElementById("pv");
const reel = document.getElementById("reel");
const rcount = document.getElementById("rcount");
let shot = 0;

pv.addEventListener("error", () => thumb.classList.remove("playing"));


function showShot(){
  const files = current < 0 ? [] : data[current][5];
  thumb.classList.remove("playing");
  reel.classList.toggle("on", files.length > 1);
  if (files.length > 1) {
    rcount.textContent = String(shot + 1).padStart(2, "0") + " / " + String(files.length).padStart(2, "0");
  }
  if (!files.length) { pv.removeAttribute("src"); return; }
  const f = files[shot];
  const vx = (typeof vimeoExtra !== "undefined" && vimeoExtra) || {};
  if (f.startsWith("vimeo:")) {
    // lavoro solo su Vimeo: niente loop, la colonna mostra la miniatura
    pv.pause(); pv.removeAttribute("src");
    const t = vx[f] && vx[f].thumb;
    thumb.style.backgroundImage = t ? "url(" + t + ")" : "";
    thumb.classList.toggle("still", !!t);
    thumb.classList.toggle("playing", !!t);
    return;
  }
  thumb.style.backgroundImage = ""; thumb.classList.remove("still");
  pv.src = "video/" + f;
  pv.play().then(() => thumb.classList.add("playing")).catch(() => {});
}

function step(n){
  const files = current < 0 ? [] : data[current][5];
  if (files.length < 2) return;
  shot = (shot + n + files.length) % files.length;
  showShot();
}
document.getElementById("rprev").addEventListener("click", () => step(-1));
document.getElementById("rnext").addEventListener("click", () => step(1));
const els = [];

data.forEach(([code,brand,title,id,year,files,page], i) => {
  const b = document.createElement("a");
  b.href = page || ("progetto.html?id=" + id);
  b.className = "row";
  b.innerHTML = '<span class="code"></span><span class="bname"></span><span class="name"></span><span class="yr"></span>';
  b.querySelector(".code").textContent = code;
  b.querySelector(".bname").textContent = brand;
  b.querySelector(".name").textContent = title;
  b.querySelector(".yr").textContent = year;
  b.addEventListener("mouseenter", () => setActive(i));
  b.addEventListener("focus", () => setActive(i));
  list.appendChild(b);
  els.push(b);
});

let current = -1;
function setActive(i){
  if (i === current) return;
  if (els[current]) els[current].classList.remove("is-active");
  current = i;
  if (i < 0){ stage.classList.remove("active"); return; }
  const [,brand,title,id] = data[i];
  pId.textContent = id;
  pBrand.textContent = brand;
  pTitle.textContent = title;
  els[i].classList.add("is-active");
  stage.classList.add("active");

  shot = 0;
  // il video si carica solo quando la riga resta attiva un attimo: scorrendo veloce non si accodano download
  clearTimeout(setActive.t);
  thumb.classList.remove("playing");
  setActive.t = setTimeout(showShot, 160);
}

const visible = new Set();
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    const i = els.indexOf(e.target);
    if (e.isIntersecting) visible.add(i); else visible.delete(i);
  });
  if (visible.size) setActive(Math.min(...visible));
  else if (window.scrollY < 40) setActive(-1);
}, { rootMargin: "-45% 0px -45% 0px", threshold: 0 });

els.forEach(el => io.observe(el));

</script>

</body>
</html>
