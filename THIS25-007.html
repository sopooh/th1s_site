<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frames — th1s.prd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF7;--ink:#111110;--muted:#8C8C86;--line:#E2E1DB;--thumb:#EFEEE9;
  --sans:'Archivo',-apple-system,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;padding:24px 32px 32px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rule{border-top:1px solid var(--line)}
.ph{font-size:17px;font-weight:700;letter-spacing:-.02em;color:var(--muted)}

nav{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:16px}
.wordmark{font-size:15px;letter-spacing:-.02em;font-weight:700;color:var(--ink);text-decoration:none}
.nav-links{display:flex;gap:24px}
.nav-links a{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s}
.nav-links a:hover,.nav-links a[aria-current]{color:var(--ink)}

.crumb{display:flex;justify-content:space-between;padding:12px 0 48px}
.crumb .id{font-family:var(--mono);font-size:12px;color:var(--muted)}

.titleblock{margin-bottom:48px}
.titleblock h1{font-size:44px;line-height:1.15;letter-spacing:-.01em;font-weight:400}
.titleblock h1 .b{display:block;color:var(--muted)}

.hero{margin-bottom:48px}
.hero .media{position:relative;aspect-ratio:16/9;max-width:820px;background:var(--thumb);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero .media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .cap{display:flex;justify-content:space-between;max-width:820px;padding-top:12px}

.strip{position:relative;padding:0 40px;margin-bottom:96px}
.track{display:flex;gap:16px;overflow-x:auto;scroll-behavior:smooth;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.still{flex:0 0 300px;aspect-ratio:4/3;background:var(--thumb);position:relative;overflow:hidden;
  border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center}
.still video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .2s}
.still:hover video{opacity:.7}
.still.is-current{outline:1px solid var(--ink);outline-offset:-1px}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:24px;height:24px;border:0;background:none;
  cursor:pointer;color:var(--muted);font-size:20px;line-height:1;transition:color .2s;font-family:var(--sans)}
.arrow:hover{color:var(--ink)}
.arrow.prev{left:0}
.arrow.next{right:0}

dl{display:grid;grid-template-columns:110px 1fr;max-width:520px}
dl>div{display:contents}
dt,dd{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.credits{margin-top:96px}
.credits .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding-top:12px}
.credits .cols p{font-size:14px;margin-top:8px}

.next-project{margin-top:96px;display:block;text-decoration:none;padding:24px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.next-project .t{font-size:28px;line-height:1.2;margin-top:8px;transition:opacity .2s}
.next-project .t span{color:var(--muted)}
.next-project:hover .t{opacity:.55}

footer{display:flex;justify-content:space-between;margin-top:48px;padding-top:12px}

@media (max-width:820px){
  body{padding:20px}
  .titleblock{margin-bottom:32px}
  .titleblock h1{font-size:30px}
  .strip{padding:0;margin-bottom:48px}
  .arrow{display:none}
  .still{flex-basis:220px}
  .credits .cols{grid-template-columns:1fr}
  .next-project .t{font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.track{scroll-behavior:auto}}
</style>
</head>
<body>

<nav>
  <a class="wordmark" href="index.html">th1s.prd</a>
  <div class="nav-links">
    <a href="index.html" aria-current="page">Work</a>
    <a href="#">Studio</a>
    <a href="#">Contact</a>
  </div>
</nav>

<div class="rule"></div>
<div class="crumb">
  <span class="eyebrow">Project</span>
  <span class="id">THIS25-007</span>
</div>

<div class="titleblock">
  <h1><span class="b">Prada</span>Frames</h1>
</div>

<div class="hero">
  <div class="media">
    <span class="ph">th1s.prd</span>
    <video id="hero" muted loop playsinline autoplay preload="metadata"></video>
  </div>
  <div class="cap">
    <span class="eyebrow" id="cap-name"></span>
    <span class="eyebrow" id="cap-count"></span>
  </div>
</div>

<div class="strip">
  <button class="arrow prev" id="prev" aria-label="Indietro">&lsaquo;</button>
  <div class="track" id="track"></div>
  <button class="arrow next" id="next" aria-label="Avanti">&rsaquo;</button>
</div>

<dl>
  <div><dt>Year</dt><dd>2025</dd></div>
  <div><dt>Client</dt><dd>Prada</dd></div>
  <div><dt>Market</dt><dd>ITA</dd></div>
  <div><dt>Output</dt><dd>Video</dd></div>
  <div><dt>Channels</dt><dd>Instagram, TikTok</dd></div>
</dl>

<div class="credits">
  <div class="rule"></div>
  <div class="cols">
    <div><span class="eyebrow">Direction</span><p>Sophie P.</p></div>
    <div><span class="eyebrow">Post production</span><p>Sophie P.</p></div>
    <div><span class="eyebrow">Production</span><p>Prada in-house</p></div>
  </div>
</div>

<a class="next-project" href="#">
  <span class="eyebrow">Next</span>
  <div class="t"><span>Miu Miu &middot; </span>FW25 Show</div>
</a>

<footer>
  <span class="eyebrow">th1s.prd (24/26)</span>
  <span class="eyebrow" style="text-align:right">Milano<br>[02]</span>
</footer>

<script>
// I file di questo progetto. Una riga per variante.
const files = [
  "THIS25-007_A_prada_frames.mp4",
  "THIS25-007_B_prada_frames.mp4",
  "THIS25-007_C_prada_frames.mp4"
];

const hero = document.getElementById("hero");
const track = document.getElementById("track");
const capName = document.getElementById("cap-name");
const capCount = document.getElementById("cap-count");
let cur = 0;

files.forEach((f, i) => {
  const b = document.createElement("button");
  b.className = "still";
  b.innerHTML = '<span class="ph">th1s.prd</span>';
  const v = document.createElement("video");
  v.src = "video/" + f;
  v.muted = true; v.loop = true; v.playsInline = true; v.preload = "metadata";
  v.autoplay = true;
  b.appendChild(v);
  b.addEventListener("click", () => show(i));
  track.appendChild(b);
});

function show(i){
  cur = i;
  hero.src = "video/" + files[i];
  hero.play().catch(() => {});
  capName.textContent = files[i].replace(/\.mp4$/, "");
  capCount.textContent = String(i + 1).padStart(2, "0") + " / " + String(files.length).padStart(2, "0");
  [...track.children].forEach((n, k) => n.classList.toggle("is-current", k === i));
}
show(0);

const step = () => track.querySelector(".still").offsetWidth + 16;
document.getElementById("prev").addEventListener("click", () => track.scrollBy({left: -step()}));
document.getElementById("next").addEventListener("click", () => track.scrollBy({left: step()}));

if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches && files.length > 3) {
  let paused = false;
  ["mouseenter","focusin","touchstart"].forEach(e => track.addEventListener(e, () => { paused = true; }));
  ["mouseleave","focusout","touchend"].forEach(e => track.addEventListener(e, () => { paused = false; }));
  const tick = () => {
    if (!paused) {
      track.scrollLeft += 0.4;
      if (track.scrollLeft >= track.scrollWidth / 2) track.scrollLeft = 0;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
</script>

</body>
</html>
